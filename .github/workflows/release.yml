name: Tag build and release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Minecraft 1.21.11 mod
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties

      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          properties = dict(line.strip().split('=', 1) for line in Path('gradle.properties').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
          tag = os.environ['RELEASE_TAG']
          version = re.sub(r'[^A-Za-z0-9._+-]', '-', tag.removeprefix('v')) if tag else properties['mod_version']
          if not version:
              raise SystemExit('The tag must contain a version name')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          print(f'Building Satellite Map {version} for Minecraft {properties["minecraft_version"]}')
          PY

      - name: Build and run offline tests
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          bash ./gradlew --no-daemon --stacktrace clean build
          "-Pmod_version=$MOD_VERSION"
          -Dorg.gradle.internal.http.socketTimeout=30000
          -Dorg.gradle.internal.http.connectionTimeout=10000

      - name: Prepare release files
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          properties = dict(line.strip().split('=', 1) for line in Path('gradle.properties').read_text().splitlines() if '=' in line and not line.lstrip().startswith('#'))
          version = os.environ['MOD_VERSION']
          name = properties['archives_base_name']
          minecraft = properties['minecraft_version']
          output = Path('build/release')
          output.mkdir(parents=True, exist_ok=True)
          jar = Path(f'build/libs/{name}-{version}.jar')
          with zipfile.ZipFile(jar) as archive:
              metadata = json.loads(archive.read('fabric.mod.json'))
          if metadata['version'] != version or metadata['depends']['minecraft'] != minecraft:
              raise SystemExit('Built mod metadata does not match the release')
          for file in (jar, Path(f'build/libs/{name}-{version}-sources.jar')):
              shutil.copy2(file, output / file.name)
          with zipfile.ZipFile(output / f'{name}-{version}-mc{minecraft}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.write(jar, f'mods/{jar.name}')
              for document in ('README.md', 'TESTING.md', 'LICENSE'):
                  archive.write(document, document)
          checksums = ''.join(f'{hashlib.sha256(file.read_bytes()).hexdigest()}  {file.name}\n' for file in sorted(output.iterdir()) if file.is_file())
          (output / 'SHA256SUMS.txt').write_text(checksums, encoding='utf-8')
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: satellite-map-${{ steps.version.outputs.version }}-mc1.21.11
          path: build/release/*
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/release/* --clobber
          else
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" build/release/* \
              --verify-tag --title "Satellite Map $RELEASE_TAG" \
              --generate-notes "${options[@]}"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
